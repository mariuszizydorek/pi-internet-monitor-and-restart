[project]
name = "netwatch"
version = "0.1.0"
description = "Raspberry Pi internet monitor, Deco status, and router power-cycle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tplink-deco-api>=1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netwatch-monitor = "netwatch.monitor.service:main"
netwatch-speedtest = "netwatch.speedtest.service:main"
netwatch-sync = "netwatch.sync.service:main"
netwatch-restart = "netwatch.restart.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
